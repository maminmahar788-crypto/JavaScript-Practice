<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
    let Equal = 5 == "5";
    let Equal_Type = 5 === "5";
    let Not_Equal = 5 != "6";
    let Not_Equal_Type = 5 !== "5";
    let Greater_Than = 5 > 3;
    let Less_Than = 5 < 3;
    let Greater_Or_Equal = 5 >= 5;
    let Less_Or_Equal = 3 <= 5;
    console.log("Equal: " + Equal);
    console.log("Equal_Type: " + Equal_Type);
    console.log("Not_Equal: " + Not_Equal);
    console.log("Not_Equal_Type: " + Not_Equal_Type);
    console.log("Greater_Than: " + Greater_Than);
    console.log("Less_Than: " + Less_Than);
    console.log("Greater_Or_Equal: " + Greater_Or_Equal);
    console.log("Less_Or_Equal: " + Less_Or_Equal);
    </script>
</body>
</html>

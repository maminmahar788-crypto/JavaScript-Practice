<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Student {
    constructor(name, age, grade) {
        this.name = name;
        this.age = age;
        this.grade = grade;
    }

    introduce() {
        console.log(
            `My name is ${this.name}, I am ${this.age} years old, and my grade is ${this.grade}.`
        );
    }
}

const student1 = new Student("Ali", 20, "A");
const student2 = new Student("Ahmed", 22, "B");

student1.introduce();
student2.introduce();
    </script>
</body>
</html>
